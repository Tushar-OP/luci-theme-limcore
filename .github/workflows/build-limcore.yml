
name: Build LimCore with verified OpenWrt SDK

on:
  workflow_dispatch:

# The job only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      # Replace these four values before running the workflow.
      OPENWRT_RELEASE: "25.12.6"
      OPENWRT_TARGET: "mediatek/filogic"
      SDK_FILENAME: "openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
      SDK_SHA256: "1c04ac47bdfc361d6aab299eb520d570e368013dedcb8d29cf39dc7168ae642e"

    steps:
      - name: Checkout pinned LimCore source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6f6452598c0ba3176c2d99137da9b85c3b38ef5b
          persist-credentials: false
          fetch-depth: 1

      - name: Validate source and SDK settings
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SOURCE="6f6452598c0ba3176c2d99137da9b85c3b38ef5b"
          ACTUAL_SOURCE="$(git rev-parse HEAD)"
          test "$ACTUAL_SOURCE" = "$EXPECTED_SOURCE"

          [[ "$OPENWRT_RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$OPENWRT_TARGET" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]
          [[ "$SDK_FILENAME" =~ ^openwrt-sdk-[A-Za-z0-9._+-]+\.tar\.(zst|xz)$ ]]
          [[ "$SDK_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]

          echo "Pinned source and input formats verified."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3-dev \
            python3-setuptools rsync swig time unzip wget \
            xsltproc zlib1g-dev file zstd

      - name: Download and verify SDK archive
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}"
          SDK_PATH="$RUNNER_TEMP/openwrt-sdk.tar"

          curl --fail --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "$BASE_URL/$SDK_FILENAME" \
            --output "$SDK_PATH"

          # SDK_SHA256 must have been copied from the
          # independently signature-verified OpenWrt checksum file.
          printf '%s  %s\n' "$SDK_SHA256" "$SDK_PATH" \
            | sha256sum --check --strict -

      - name: Extract SDK, pin LuCI feed and build package
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$RUNNER_TEMP/openwrt-sdk"
          mkdir -p "$SDK_DIR"

          case "$SDK_FILENAME" in
            *.tar.zst)
              tar --zstd -xf "$RUNNER_TEMP/openwrt-sdk.tar" \
                -C "$SDK_DIR" --strip-components=1
              ;;
            *.tar.xz)
              tar -xJf "$RUNNER_TEMP/openwrt-sdk.tar" \
                -C "$SDK_DIR" --strip-components=1
              ;;
            *)
              echo "Unsupported SDK archive format."
              exit 1
              ;;
          esac

          # Use the LuCI branch matching the stable SDK release.
          SERIES="${OPENWRT_RELEASE%.*}"

          cd "$SDK_DIR"

          python3 - "$SERIES" <<'PY'
          import pathlib
          import sys

          series = sys.argv[1]
          path = pathlib.Path("feeds.conf.default")
          lines = path.read_text().splitlines()

          matches = [
              i for i, line in enumerate(lines)
              if line.startswith("src-git luci ")
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one active LuCI feed; inspect the SDK."
              )

          lines[matches[0]] = (
              "src-git luci "
              "https://git.openwrt.org/project/luci.git;"
              f"openwrt-{series}"
          )

          path.write_text("\n".join(lines) + "\n")
          PY

          ./scripts/feeds update luci
          ./scripts/feeds install luci-base

          # Stage only tracked files from the pinned source commit.
          mkdir -p package/luci-theme-limcore
          git -C "$GITHUB_WORKSPACE" archive --format=tar HEAD \
            | tar -xf - -C package/luci-theme-limcore

          make defconfig

          # Build the theme only; don't rebuild router-side LuCI packages.
          for pkg in luci luci-base liblucihttp liblucihttp-lua liblucihttp-ucode; do
          ./scripts/config --disable "PACKAGE_${pkg}"
          done
          
          make defconfig
          
          # Build LimCore.
          make -j2 package/luci-theme-limcore/compile V=s

          mkdir -p "$GITHUB_WORKSPACE/dist"

          mapfile -t PACKAGES < <(
            find "$SDK_DIR/bin" -type f \
              \( -name 'luci-theme-limcore*.apk' \
                 -o -name 'luci-theme-limcore*.ipk' \) \
              -print
          )

          if (( ${#PACKAGES[@]} == 0 )); then
            echo "No LimCore package was produced."
            exit 1
          fi

          cp "${PACKAGES[@]}" "$GITHUB_WORKSPACE/dist/"

          {
            echo "LimCore source commit: $(git rev-parse HEAD)"
            echo "OpenWrt release: $OPENWRT_RELEASE"
            echo "OpenWrt target: $OPENWRT_TARGET"
            echo "SDK archive: $SDK_FILENAME"
            echo "SDK SHA-256: $SDK_SHA256"
          } > "$GITHUB_WORKSPACE/dist/BUILD-METADATA.txt"

          cd "$GITHUB_WORKSPACE/dist"
          shopt -s nullglob
          FILES=( *.apk *.ipk )

          sha256sum "${FILES[@]}" BUILD-METADATA.txt > SHA256SUMS

      - name: Upload package for manual inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: limcore-openwrt-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
